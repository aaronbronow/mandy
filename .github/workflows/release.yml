name: Release Mandy Binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64

    steps:
      - uses: actions/checkout@v4

      # --- CLOJURE / GRAALVM SECTION ---
      - name: Setup GraalVM & Native Image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with: { cli: 1.12.4.1618 }

      - name: Build Mandy Native Binary
        run: clojure -T:build native

      # --- BUN / TYPESCRIPT SECTION ---
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Build mandy-ui (Native)
        run: |
          bun install
          bun build ./src/index.ts --compile --outfile mandy-ui

      # --- PACKAGING SECTION ---
      - name: Create Release Package
        run: |
          mkdir -p dist/bin
          cp mandy mandy-ui dist/bin/
          tar -czvf mandy-v0.1.0-${{ matrix.platform }}.tar.gz -C dist .

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: mandy-v0.1.0-${{ matrix.platform }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
