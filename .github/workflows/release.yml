name: Release Mandy Binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g. v0.1.0). If empty, uses the pushed tag.'
        required: false
        default: ''

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64

    steps:
      - uses: actions/checkout@v4

      # --- CLOJURE / GRAALVM SECTION ---
      - name: Setup GraalVM & Native Image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with: { cli: 1.12.4.1618 }

      - name: Build Mandy Native Binary
        run: clojure -T:build native

      # --- BUN / TYPESCRIPT SECTION ---
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Build mandy-ui (Native)
        run: |
          bun install
          bun build ./src/index.ts --compile --outfile mandy-ui

      # --- PACKAGING SECTION ---
      - name: Create Release Package
        run: |
          mkdir -p dist/bin
          cp mandy mandy-ui dist/bin/
          tar -czvf mandy-v0.1.0-${{ matrix.platform }}.tar.gz -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mandy-v0.1.0-${{ matrix.platform }}
          path: mandy-v0.1.0-${{ matrix.platform }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=v0.1.0-manual-$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: artifacts/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
