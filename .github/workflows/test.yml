name: Run Mandy Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with: { cli: 1.12.4.1618 }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc rlwrap man-db manpages
          sudo mandb

      - name: Install YAMLScript
        run: curl -sSL https://yamlscript.org/install | sudo bash

      - name: Verify Environment
        run: |
          which clojure
          which ys
          which pandoc
          which col
          ys --version
          man ls | col -b | head -n 5

      - name: Install dependencies
        run: bun install

      - name: Run Core Tests
        run: |
          make test-debug
          make test-sanitized
          make test-tokens

      - name: Run TUI Automated Tests
        run: |
          make test-tui-select
          make test-tui-quit
          make test-tui-search
